<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Enigma Go</title>
<!--
  GitHub Pages sirve este archivo en cualquier ruta inexistente del sitio,
  a cualquier profundidad. Por eso no carga recursos propios (todo va en
  línea) y el enlace de vuelta usa la ruta absoluta del sitio de proyecto.
  Si el repo cambia de nombre o se usa un dominio propio, actualiza el href.
-->
<style>
  :root {
    --tinta: #1F1B3D;
    --papel: #F3EEDF;
    --lila: #BDB6E0;
    --citrino: #F2C14E;
    --gutter: clamp(16px, 5vw, 64px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: var(--gutter);
    background: var(--tinta);
    color: var(--papel);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: clamp(1.125rem, 0.9rem + 0.6vw, 1.375rem);
    line-height: 1.55;
  }

  main { max-width: 36rem; }

  .marca {
    margin: 0 0 0.5rem;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--citrino);
    font-size: clamp(2.5rem, 1.5rem + 4vw, 4rem);
    line-height: 1;
  }

  h1 {
    margin: 0 0 1rem;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2.25rem);
    line-height: 1.15;
  }

  p { margin: 0 0 1.5rem; color: var(--lila); }

  a {
    color: var(--citrino);
    text-underline-offset: 0.2em;
  }

  a:focus-visible {
    outline: 3px solid var(--citrino);
    outline-offset: 4px;
  }
</style>
</head>
<body>
<main>
  <p class="marca">Enigma Go</p>
  <h1>Esta pista no lleva a ninguna parte.</h1>
  <p>La página que buscas no existe o cambió de lugar.</p>
  <a href="/HarnessDeOrquestacion/">Volver a la portada</a>
</main>
</body>
</html>
