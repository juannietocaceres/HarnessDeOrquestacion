<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8edf3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1626" media="(prefers-color-scheme: dark)">
  <title>Inscripción a talleres</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <span class="marca">Talleres</span>
    <button id="btn-salir" class="enlace" type="button" hidden>Cerrar sesión</button>
  </header>

  <main id="contenido">
    <noscript><p class="aviso">Esta página necesita JavaScript para funcionar.</p></noscript>

    <section id="vista-config" class="panel" hidden>
      <h1>Falta la configuración</h1>
      <p class="aviso" role="alert">No encuentro las claves del proyecto. Crea <code>config.js</code> a partir de <code>config.example.js</code> y recarga la página. Los pasos están en el README.</p>
    </section>

    <section id="vista-auth" class="panel" hidden>
      <h1>Reserva tu lugar en el taller</h1>
      <p class="sub">Entra con tu correo para ver los talleres y apartar un cupo.</p>
      <div class="pestanas" role="tablist" aria-label="Acceso">
        <button id="tab-login" role="tab" type="button" aria-selected="true" aria-controls="form-auth">Iniciar sesión</button>
        <button id="tab-registro" role="tab" type="button" aria-selected="false" aria-controls="form-auth">Crear cuenta</button>
      </div>
      <form id="form-auth" novalidate>
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        <p id="error-auth" class="error" role="alert" hidden></p>
        <button id="enviar-auth" class="boton" type="submit">Iniciar sesión</button>
      </form>
    </section>

    <section id="vista-app" hidden>
      <p id="saludo" class="sub"></p>

      <div id="bloque-mis" class="panel" hidden>
        <h2>Tu inscripción</h2>
        <ul id="lista-mis" class="lista"></ul>
      </div>

      <div class="panel">
        <h2>Talleres</h2>
        <label for="nombre">Tu nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" maxlength="100">
        <p id="error-nombre" class="error" role="alert" hidden></p>
        <p id="estado-lista" class="sub" hidden></p>
        <ul id="lista-talleres" class="lista"></ul>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
